[tool.poetry]
name = "learningdjango"
version = "0.1.0"
description = ""
authors = ["kirill <kirill48108@gmail.com>"]
readme = "README.MD"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
django = "==5.2.7"
djangorestframework = "==3.16.1"
python-dotenv = "==1.2.1"
psycopg2-binary = "==2.9.11"
pillow = "==12.0.0"
django-filter = "==25.2"
djangorestframework-simplejwt = "==5.3.1"
drf-spectacular = "==0.27.2"
stripe = "==10.2.0"
celery = "==5.4.0"
redis = "==5.0.1"
gunicorn = "^23.0.0"
pytest = "^9.0.2"
pytest-cov = "^7.0.0"

[tool.poetry.group.lint.dependencies]
black = "==25.9.0"
isort = "==7.0.0"
ruff = "^0.14.8"


[tool.poetry.group.dev.dependencies]
coverage = "^7.11.3"
pytest-django = "^4.11.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]


[tool.isort]
profile = "black"
line_length = 100

[tool.black]
line_length = 100
target_version = ['py313']